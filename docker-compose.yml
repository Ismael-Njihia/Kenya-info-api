version: '3.8'

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - SERVER_MODE=release
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DATABASE=kenya_info
      - MONGODB_TIMEOUT=10
      - LOG_LEVEL=info
      - LOG_OUTPUT_PATH=stdout
    depends_on:
      - mongo
    networks:
      - kenya-api-network
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - kenya-api-network
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  kenya-api-network:
    driver: bridge
