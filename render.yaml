# render.yaml
services:
  - type: web
    name: kenya-info-api
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: kenya_info
      - key: MONGODB_TIMEOUT
        value: 10
    healthCheckPath: /health
